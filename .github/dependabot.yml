version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
      tooling:
        patterns:
          - eslint
          - prettier
          - typescript
          - vitest
          - '@playwright/test'
    ignore:
      # typescript-eslint (via eslint-config-next) does not support TS 7 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
